<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Odoo - Mover la referencia de cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <section class="container py-5">
        <div class="text-center">
            <h1 class="fw-bold text-primary">Mueve la referencia del cliente</h1>
            <p class="lead">Mueve la referencia del cliente abajo de los terminos de pago.</p>
        </div>

        <div class="row justify-content-center my-4">
            <div class="col-md-8 text-center">
                <h2 class="fw-semibold text-info">Compatible con Odoo Community 12.0, 16.0</h2>
            </div>
        </div>

        <div class="row justify-content-center my-4">
            <div class="col-md-6 text-center">
                <a href="https://github.com/AlfaSystemas5457/client_reference" target="_blank"
                    class="btn btn-primary btn-lg">
                    <span class="fs-4">Ver en GitHub</span>
                </a>
            </div>
        </div>

        <div class="row justify-content-center my-5">
            <div class="col-md-8">
                <p>Vista previa.</p>
                <div class="text-center">
                    <img src="./assets/Vista referencia.png" alt="Vista referencia" class="img-fluid rounded shadow">
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
